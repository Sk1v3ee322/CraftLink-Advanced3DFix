[package]
name = "craftlink-installer"
version = "1.0.0"
edition = "2021"
description = "Installs the finished CraftLink / 3D layer-style builds into a FilmCraft / EffectCraft portable folder"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "CraftLink-Installer"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true