[package]
name = "craftlink-patcher"
version = "1.0.0"
edition = "2021"
description = "Applies the CraftLink and 3D layer-style patches to FilmCraft / EffectCraft release trees"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "craftlink-patcher"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true